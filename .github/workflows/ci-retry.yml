name: CI infra retry

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rerun the failed jobs if they failed on infrastructure only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs > jobs.json
          if python3 scripts/ci/infra_failure.py jobs.json; then
            echo "::notice::run $RUN_ID failed on infrastructure only; rerunning its failed jobs"
            gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY" --failed
          else
            echo "run $RUN_ID failed in project code; not rerunning"
          fi
