name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.key.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Key the image by its inputs
        id: key
        shell: bash
        run: |
          key=$(git rev-parse HEAD:docker/Dockerfile HEAD:docker/ros-apt \
            HEAD:requirements-docs.txt HEAD:third_party/reactor-c HEAD:third_party/patches \
            | sha256sum | cut -c1-16)
          repo="${GITHUB_REPOSITORY:-cps-rwth/rcllf}"
          echo "ref=ghcr.io/${repo,,}:ci-dev-$key" >> "$GITHUB_OUTPUT"
          echo "image ghcr.io/${repo,,}:ci-dev-$key"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look for an image built from the same inputs
        id: have
        shell: bash
        env:
          REF: ${{ steps.key.outputs.ref }}
        run: |
          if docker manifest inspect "$REF" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "found $REF"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "no $REF yet: building it"
          fi

      - name: Fetch reactor-c
        if: steps.have.outputs.build == 'true'
        run: git submodule update --init --depth 1 third_party/reactor-c

      - name: Set up Docker Buildx
        if: steps.have.outputs.build == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build and push the dev image
        id: build1
        if: steps.have.outputs.build == 'true'
        continue-on-error: true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          push: true
          tags: ${{ steps.key.outputs.ref }}
          cache-from: |
            type=gha,scope=dev-main
            type=gha,scope=dev-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=dev-${{ github.ref_name }}

      - name: Build and push the dev image (retry)
        if: steps.have.outputs.build == 'true' && steps.build1.outcome == 'failure'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          push: true
          tags: ${{ steps.key.outputs.ref }}
          cache-from: |
            type=gha,scope=dev-main
            type=gha,scope=dev-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=dev-${{ github.ref_name }}

  lint:
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build workspace
        uses: ./.github/actions/build-workspace
        with:
          save-cache: "true"

      - name: Run tests (includes ament linting; same as scripts/lint.sh)
        shell: bash
        run: scripts/ci/lint.sh colcon-test

      - name: Check colcon-lf shards partition the suite
        shell: bash
        run: scripts/ci/lint.sh shards

      - name: Run ros2lf tool tests
        shell: bash
        run: scripts/ci/lint.sh ros2lf

      - name: Mark the workspace safe for git
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run lf_eval tool tests
        shell: bash
        run: scripts/ci/lint.sh lf-eval

      - name: Check the support matrix is current
        shell: bash
        run: scripts/ci/lint.sh matrices

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results-lint
          path: output/
          retention-days: 14

  colcon-lf:
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build workspace
        uses: ./.github/actions/build-workspace

      - name: Run colcon-lf extraction tool tests (shard ${{ matrix.shard }}/4)
        shell: bash
        env:
          RCLLF_REQUIRE_ROS_TESTS: "1"
          RCLLF_TEST_SHARD: ${{ matrix.shard }}/4
        run: scripts/ci/colcon_lf.sh

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results-colcon-lf-${{ matrix.shard }}
          path: output/
          retention-days: 14

  runtime-smoke:
    name: runtime-smoke (${{ matrix.group }})
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: pubsub-service-reentrant
            entries: |
              pubsub_example service_example:pubsub or negative or service
              correspondence_fixture:corr_reentrant::corr_reentrant
          - group: corr-many-lifecycle
            hooks: "true"
            entries: |
              lifecycle_example:lifecycle and not manual
              lifecycle_example:manual:../tools/colcon_lf/tests/runtime/lifecycle_manual_execution.yaml
              correspondence_fixture:correspondence and not pubsub:../tools/colcon_lf/tests/runtime/corr_many_execution.yaml
          - group: corr-relay-burst
            hooks: "true"
            entries: |
              correspondence_fixture:corr_relay::corr_relay
              correspondence_fixture:corr_burst:../tools/colcon_lf/tests/runtime/corr_many_k2_execution.yaml
              take_skip_fixture:take_skip and not fan and not across_federates::take_one
              take_skip_fixture:take_skip and fan::take_fan
              take_skip_fixture:across_federates::take_one:per-node
              pubsub_example:flush_complete:::../tools/colcon_lf/tests/runtime/pubsub_flush_federation.yaml
          - group: corr-loop-two-group
            entries: |
              correspondence_fixture:corr_loop and not delayed::corr_loop
              correspondence_fixture:corr_loop and delayed::corr_loop_echo_delayed
              correspondence_fixture:corr_two_group::corr_two_group
          - group: remap-twin-sub
            entries: |
              correspondence_fixture:launch_remap::corr_remap
              handle_matching_example:twin_sub::twin_sub
          - group: parameter-bind-order
            entries: |
              parameter_example:parameter
              parameter_example:headerless::headerless_params
              callback_group_example:bind_order
          - group: same-tag
            entries: |
              same_tag_fixture:same_tag_one::st_one
              same_tag_fixture:xfed::st_one:src/same_tag_fixture/st_one_2fed.federation.yaml
              same_tag_fixture:same_tag_chain or same_tag_modularity::st_chain
          - group: shared-join
            hooks: "true"
            entries: |
              correspondence_fixture:corr_shared_join and not deferred::corr_shared_join
          - group: sync-oracle
            hooks: "true"
            entries: |
              sync_oracle_showcase:sync_oracle and not forkjoin::corpus
              sync_oracle_showcase:sync_oracle and forkjoin::forkjoin
          - group: tf2-acq
            entries: |
              tf2_acq_example:tf2_acq
          - group: brake-fusion
            entries: |
              brake_fusion:brake_fusion:src/brake_fusion/config/t2/subs.execution.yaml:t2_approx
          - group: fusion-example
            entries: |
              fusion_example:fusion_example::bringup
          - group: semantic-trace
            hooks: "true"
            semantic: "1"
            entries: |
              pubsub_example service_example:semantic_trace and (pubsub_payload or without_admitted_edges)
              correspondence_fixture:semantic_trace and zero_delay_loop::corr_loop
              correspondence_fixture:semantic_trace and not pubsub_payload and not without_admitted_edges and not zero_delay_loop:../tools/colcon_lf/tests/runtime/corr_many_execution.yaml

    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --shm-size 1g

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build workspace
        uses: ./.github/actions/build-workspace
        with:
          corr-test-hooks: ${{ matrix.hooks || 'false' }}

      - name: Run runtime smoke tests, ${{ matrix.group }}
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          ROS_DOMAIN_ID: "0"
          ENTRIES: ${{ matrix.entries }}
          RCLLF_RUN_SEMANTIC_TRACE: ${{ matrix.semantic || '0' }}
          SYNC_CORPUS: ${{ github.workspace }}/packages/src/sync_oracle_showcase/corpora/p1.yaml
        run: scripts/ci/runtime_smoke.sh

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results-runtime-smoke-${{ matrix.group }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore

  binding-release:
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch reactor-c
        shell: bash
        run: scripts/ci/binding_release.sh reactor-c

      - name: Install rosdep dependencies (lf-frame)
        shell: bash
        run: scripts/ci/build_workspace.sh deps packages/lf-frame

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-release-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-release-${{ runner.os }}-

      - name: Build ros2_lf_binding (Release)
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: scripts/ci/binding_release.sh build

      - name: Save ccache
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-release-${{ runner.os }}-${{ github.sha }}

      - name: Run ros2_lf_binding tests (Release)
        shell: bash
        run: scripts/ci/binding_release.sh test

  build-and-test:
    needs: [image, lint, colcon-lf, runtime-smoke, binding-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate job results
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          for job in $bad; do echo "::error::$job did not succeed"; done
          [ -z "$bad" ]

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs and Material theme
        run: scripts/ci/docs.sh install

      - name: Build docs (strict)
        run: scripts/ci/docs.sh build

      - name: Check docs punctuation
        run: scripts/ci/docs.sh punctuation

      - name: Install pytest
        run: pip install pytest

      - name: Check library names unique across packages
        run: scripts/ci/docs.sh scripts
