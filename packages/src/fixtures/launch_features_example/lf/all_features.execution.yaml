# rcllf execution config for launch/all_features.launch.py, read by colcon lf-generate.
# These topics have no publisher inside this launch, so they are declared
# external. Each message enters LF time at arrival.
external_topics:
  # fed by 'ros2 topic pub' (no node in the repo publishes it)
  - /alt_input
  # fed by 'ros2 topic pub' (no node in the repo publishes it)
  - /feature_input
  # fed by 'ros2 topic pub' (no node in the repo publishes it)
  - /outer_ns/inner_ns/feature_input
  # fed by 'ros2 topic pub' (no node in the repo publishes it)
  - /unscoped_ns/feature_input
# Each timer period comes from the timer_period_ms parameter, which the analyzer
# cannot read (RCLLF-R001), so it is set here to the period the node runs with.
nodes:
  # 500 ms: the timer_period_ms default, src/feature_node.cpp:30
  '/ns1/ns_remap_node':
    timers:
      timer_callback:
        period: 500 msec
  # 500 ms: the timer_period_ms launch argument default, launch/02_arg_with_choices.launch.py:26
  choices_node:
    timers:
      timer_callback:
        period: 500 msec
  # 500 ms: the timer_period_ms default, src/feature_node.cpp:30
  primary_node:
    timers:
      timer_callback:
        period: 500 msec
  # secondary_node is not listed: its include runs only when enable_primary
  # is false (default 'true'), so it is not in system.json.
  # 500 ms: the timer_period_ms default, src/feature_node.cpp:30
  respawn_node:
    timers:
      timer_callback:
        period: 500 msec
  # 300 ms: the value config/params_a.yaml:3 sets (node default 500, src/feature_node.cpp:30)
  feature_node:
    timers:
      timer_callback:
        period: 300 msec
  # 500 ms: the timer_period_ms default, src/feature_node.cpp:30
  env_node:
    timers:
      timer_callback:
        period: 500 msec
  # 500 ms: the timer_period_ms default, src/feature_node.cpp:30
  exec_process_node:
    timers:
      timer_callback:
        period: 500 msec
  # 500 ms: the timer_period_ms default, src/feature_node.cpp:30
  delayed_node:
    timers:
      timer_callback:
        period: 500 msec
  # 500 ms: the timer_period_ms default, src/feature_component.cpp:32
  dynamic_component:
    timers:
      timer_callback:
        period: 500 msec
  # 500 ms: the timer_period_ms default, src/feature_component.cpp:32
  mt_component:
    timers:
      timer_callback:
        period: 500 msec
  # 500 ms: the timer_period_ms default, src/feature_component.cpp:32
  loaded_component:
    timers:
      timer_callback:
        period: 500 msec
  # 500 ms: the timer_period_ms launch argument default, launch/12_opaque_function.launch.py:43
  opaque_node:
    timers:
      timer_callback:
        period: 500 msec
  # 500 ms: the timer_period_ms default, src/feature_node.cpp:30
  group_node_a:
    timers:
      timer_callback:
        period: 500 msec
  # 500 ms: the timer_period_ms default, src/feature_node.cpp:30
  '/unscoped_ns/group_node_b':
    timers:
      timer_callback:
        period: 500 msec
  # 500 ms: the timer_period_ms default, src/feature_node.cpp:30
  '/outer_ns/inner_ns/nested_node':
    timers:
      timer_callback:
        period: 500 msec
