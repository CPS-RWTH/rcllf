# rcllf execution config for launch/16_node_arguments.launch.py, read by colcon lf-generate.
# These topics have no publisher inside this launch, so they are declared
# external. Each message enters LF time at arrival.
external_topics:
  # renamed's input; fed by 'ros2 topic pub' (no node in this launch publishes it)
  - /feature_input
  # listener's input; fed by 'ros2 topic pub' (no node in this launch publishes it)
  - /grp/feature_input
  # x's input; fed by 'ros2 topic pub' (no node in this launch publishes it)
  - /ra/feature_input
# Each timer period comes from the timer_period_ms parameter, which the analyzer
# cannot read (RCLLF-R001), so it is set here to the period the node runs with.
nodes:
  # 300 ms: the launch parameters= value, which beats the earlier -p 250
  'renamed':
    timers:
      timer_callback:
        period: 300 msec
  # 500 ms: the timer_period_ms default, src/feature_node.cpp:30
  '/grp/listener':
    timers:
      timer_callback:
        period: 500 msec
  # 700 ms: the -p rule in ros_arguments=
  '/ra/x':
    timers:
      timer_callback:
        period: 700 msec
