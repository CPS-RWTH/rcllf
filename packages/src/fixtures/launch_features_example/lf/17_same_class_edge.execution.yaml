# rcllf execution config for launch/17_same_class_edge.launch.py, read by colcon lf-generate.
# This topic has no publisher inside this launch, so it is declared
# external. Each message enters LF time at arrival.
external_topics:
  # relay_a's feature_input; no node in the repo publishes it
  - /feature_input
# Each timer period comes from the timer_period_ms parameter, which the analyzer
# cannot read (RCLLF-R001), so it is set here to the period the node runs with.
nodes:
  # 500 ms: the timer_period_ms default, src/feature_node.cpp:30
  relay_a:
    timers:
      timer_callback:
        period: 500 msec
  # 300 ms: timer_period_ms in launch/17_same_class_edge.launch.py
  '/grp/relay_b':
    timers:
      timer_callback:
        period: 300 msec
