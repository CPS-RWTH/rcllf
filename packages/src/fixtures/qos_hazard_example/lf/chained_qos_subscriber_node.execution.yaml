# rcllf execution config for launch/chained_qos_subscriber_node.launch.py, read by colcon lf-generate.
# These topics have no publisher inside this launch, so they are declared
# external. Each message enters LF time at arrival.
external_topics:
  # fed by 'ros2 topic pub' (no node in the repo publishes it)
  - /chained_reliable_volatile_topic
  # fed by 'ros2 topic pub' (no node in the repo publishes it)
  - /chained_transient_local_topic
