# P1: plain pairing, one row per tick per input, equal stamps.
# Hand derivation against message_filters 4.11.17 sync_policies/exact_time.h:
# add() 111-123 (tuples_[stamp], slot overwritten: last wins), checkTuple()
# 157-196 (full -> signal, erase, clearOldTuples(); then while size > q drop
# tuples_.begin(), the smallest stamp), clearOldTuples() 199-219 (drop every
# stamp <= last signal, ascending).
# Arrival order = lf_arrival_order, sort by (tick, input, publish order)
# (one drain firing per input and tag). Rows r<n> are 0-based in file order, stamps in ms.
#   each tick k: r2k (in0) then r2k+1 (in1), both stamp 10(k+1); the second
#   fills the tuple -> signal[r2k, r2k+1]; nothing older is left to clear.
name: P1
policy: exact
queue: 3
rows:
  - {tick: 0, input: 0, stamp_ms: 10, payload: 0}  # r0
  - {tick: 0, input: 1, stamp_ms: 10, payload: 1}  # r1
  - {tick: 1, input: 0, stamp_ms: 20, payload: 100}  # r2
  - {tick: 1, input: 1, stamp_ms: 20, payload: 101}  # r3
  - {tick: 2, input: 0, stamp_ms: 30, payload: 200}  # r4
  - {tick: 2, input: 1, stamp_ms: 30, payload: 201}  # r5
  - {tick: 3, input: 0, stamp_ms: 40, payload: 300}  # r6
  - {tick: 3, input: 1, stamp_ms: 40, payload: 301}  # r7
  - {tick: 4, input: 0, stamp_ms: 50, payload: 400}  # r8
  - {tick: 4, input: 1, stamp_ms: 50, payload: 401}  # r9
expect:
  - signal 0 1
  - signal 2 3
  - signal 4 5
  - signal 6 7
  - signal 8 9
