# B3: a stamp older than the last signal is still accepted.
# Hand derivation against message_filters 4.11.17 sync_policies/exact_time.h:
# add() 111-123 (tuples_[stamp], slot overwritten: last wins), checkTuple()
# 157-196 (full -> signal, erase, clearOldTuples(); then while size > q drop
# tuples_.begin(), the smallest stamp), clearOldTuples() 199-219 (drop every
# stamp <= last signal, ascending).
# Arrival order = lf_arrival_order, sort by (tick, input, publish order)
# (one drain firing per input and tag). Rows r<n> are 0-based in file order, stamps in ms.
#   r0 a8, r1 b8 -> signal[r0, r1], last = 8. r2 a4 is stored (add has no
#   age check); r3 b4 -> signal[r2, r3].
name: B3
policy: exact
queue: 3
rows:
  - {tick: 0, input: 0, stamp_ms: 8, payload: 1}  # r0
  - {tick: 0, input: 1, stamp_ms: 8, payload: 2}  # r1
  - {tick: 1, input: 0, stamp_ms: 4, payload: 3}  # r2
  - {tick: 1, input: 1, stamp_ms: 4, payload: 4}  # r3
expect:
  - signal 0 1
  - signal 2 3
