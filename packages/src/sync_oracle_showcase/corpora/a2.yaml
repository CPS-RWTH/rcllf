# A2: age penalty tie region: equal spacing on both inputs, the 0.1 penalty decides.
# Expected values: derived with an independent Python port of message_filters
# 4.11.17 approximate_time.h (add() 210-258, process() 701-835 with the virtual
# search from 787), fed in lf_arrival_order = sort by (tick, input, publish
# order). The port is not shipped; the A corpora are not derived by hand, and
# the library itself (oracle O1) must agree with them.
# Rows r<n> are 0-based in file order, stamps in ms.
name: A2
policy: approx
queue: 3
rows:
  - {tick: 0, input: 0, stamp_ms: 10, payload: 1}  # r0
  - {tick: 0, input: 1, stamp_ms: 15, payload: 2}  # r1
  - {tick: 1, input: 0, stamp_ms: 20, payload: 3}  # r2
  - {tick: 1, input: 1, stamp_ms: 25, payload: 4}  # r3
  - {tick: 2, input: 0, stamp_ms: 30, payload: 5}  # r4
  - {tick: 2, input: 1, stamp_ms: 36, payload: 6}  # r5
expect:
  - signal 0 1
  - signal 2 3
